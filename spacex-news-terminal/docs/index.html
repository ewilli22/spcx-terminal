<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPCX Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090a; --panel:#0f1113; --panel-2:#14171a; --line:#1f2428; --line-2:#2a3036;
  --text:#d7dde2; --muted:#7d8790; --dim:#4f5860;
  --amber:#ffb000; --amber-dim:#7a5500;
  --up:#3ddc84; --down:#ff4d5e; --sx:#4cc3ff; --mk:#b18cff;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.mono{font-family:var(--mono)}

/* top bar */
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:#050607;position:sticky;top:0;z-index:5}
.brand{font:600 14px var(--mono);color:var(--amber);letter-spacing:.14em;white-space:nowrap}
.brand span{color:var(--muted);font-weight:400;letter-spacing:.06em}
.hdr-right{margin-left:auto;display:flex;gap:14px;align-items:center;font:12px var(--mono);color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.pill{padding:2px 8px;border:1px solid var(--line-2);border-radius:2px;font:600 11px var(--mono);letter-spacing:.08em}
.pill.open{color:var(--up);border-color:#1d5a37}
.pill.closed{color:var(--muted)}
.pill.stale{color:var(--down);border-color:#5a1d24}
button.refresh{background:none;border:1px solid var(--line-2);color:var(--text);font:12px var(--mono);padding:3px 9px;cursor:pointer;border-radius:2px}
button.refresh:hover{border-color:var(--amber);color:var(--amber)}

/* ticker */
.tape{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel);scrollbar-width:none}
.tape::-webkit-scrollbar{display:none}
.tk{flex:0 0 auto;padding:7px 16px;border-right:1px solid var(--line);font:12px var(--mono);white-space:nowrap}
.tk b{color:var(--text);font-weight:500;margin:0 6px}
.tk .lab{color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}

/* layout */
main{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:1px;background:var(--line);min-height:calc(100vh - 82px)}
.col{background:var(--bg);min-width:0}
.sec{border-bottom:1px solid var(--line);padding:14px 16px}
.sec h2{margin:0 0 10px;font:600 11px var(--mono);letter-spacing:.14em;color:var(--amber);text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}
.sec h2 small{color:var(--dim);font-weight:400;letter-spacing:.04em;text-transform:none}

/* focus card */
.focus .sym{font:600 12px var(--mono);color:var(--muted);letter-spacing:.1em}
.focus .px{font:500 34px/1.1 var(--mono);margin:4px 0 2px;color:#fff}
.focus .chg{font:500 14px var(--mono)}
.spark{width:100%;height:78px;margin-top:10px;display:block}
.range{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--dim);margin-top:4px}
.qrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:5px 0;font:12px var(--mono);border-bottom:1px dashed var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .l{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .p{color:var(--text);text-align:right}
.qrow .c{text-align:right;min-width:64px}

/* feed */
.feedhead{position:sticky;top:43px;background:var(--bg);z-index:3;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px}
.tab{background:none;border:1px solid var(--line-2);color:var(--muted);font:600 11px var(--mono);letter-spacing:.08em;padding:5px 10px;cursor:pointer;border-radius:2px}
.tab[aria-pressed="true"]{color:#000;background:var(--amber);border-color:var(--amber)}
.tab .n{opacity:.7;margin-left:4px;font-weight:400}
.search{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line-2);color:var(--text);font:12px var(--mono);padding:6px 9px;border-radius:2px;outline:none}
.search:focus{border-color:var(--amber-dim)}
.items{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:52px 46px minmax(0,1fr);gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:start}
.it:hover{background:var(--panel)}
.it.hot{box-shadow:inset 2px 0 0 var(--amber)}
.t{font:12px var(--mono);color:var(--dim);padding-top:2px}
.t .d{display:block;font-size:10px}
.score{font:600 11px var(--mono);text-align:center;padding:3px 0;border-radius:2px;border:1px solid var(--line-2);color:var(--muted)}
.score.s2{color:#000;background:#8a6a1e;border-color:#8a6a1e}
.score.s3{color:#000;background:var(--amber);border-color:var(--amber)}
.score.s4{color:#fff;background:var(--down);border-color:var(--down)}
.ttl{font-weight:500;color:var(--text);text-decoration:none;display:block}
a.ttl:hover{color:#fff;text-decoration:underline;text-decoration-color:var(--amber-dim)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;font:11px var(--mono);color:var(--dim);align-items:center}
.cat{font-weight:600;letter-spacing:.06em}
.cat.spacex{color:var(--sx)} .cat.market{color:var(--mk)} .cat.price{color:var(--amber)}
.chip{border:1px solid var(--line-2);padding:0 5px;border-radius:2px;color:var(--muted)}
.empty{padding:40px 16px;color:var(--muted);font:13px var(--mono);text-align:center}

/* catalysts */
.cal{list-style:none;margin:0;padding:0}
.cal li{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.cal li:last-child{border-bottom:0}
.cal li.past{opacity:.38}
.cd{font:600 18px/1 var(--mono);color:var(--text);text-align:right}
.cd small{display:block;font:400 10px var(--mono);color:var(--dim);margin-top:3px}
.cal .lbl{font-size:13px}
.cal .sub{font:11px var(--mono);color:var(--dim);margin-top:2px}
.tag{font:600 10px var(--mono);letter-spacing:.06em;padding:0 4px;border-radius:2px}
.tag.spacex{color:var(--sx);border:1px solid #1b4a63}
.tag.macro{color:var(--mk);border:1px solid #3e2e63}
.tag.unc{color:var(--amber);border:1px dashed var(--amber-dim)}
.health{font:11px var(--mono);color:var(--muted)}
.health div{display:flex;justify-content:space-between;padding:2px 0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
.foot{padding:14px 16px;font:11px var(--mono);color:var(--dim)}

@media (max-width:1100px){
  main{grid-template-columns:260px minmax(0,1fr)}
  .col.right{grid-column:1 / -1}
}
@media (max-width:720px){
  header{flex-wrap:wrap;gap:6px 12px}
  .brand span{display:none}
  .hdr-right{margin-left:0;width:100%;justify-content:space-between}
  main{grid-template-columns:1fr}
  .col.left{display:contents}
  .col.left .sec{background:var(--bg)}
  #focus{order:1} .col.mid{order:2} .col.left .sec:not(#focus){order:3} .col.right{order:4}
  .feedhead{top:0;position:relative}
  .it{grid-template-columns:42px 40px minmax(0,1fr);gap:9px;padding:10px 16px}
  .hdr-right .clock{display:none}
  .focus .px{font-size:30px}
}
</style>
</head>
<body>
<header>
  <div class="brand">SPCX TERMINAL <span>/ news + market monitor</span></div>
  <div class="hdr-right">
    <span class="clock" id="clock"></span>
    <span class="pill" id="mkt">...</span>
    <span id="age">loading</span>
    <button class="refresh" id="refresh" title="Reload data">REFRESH</button>
  </div>
</header>
<div class="tape" id="tape"></div>

<main>
  <div class="col left">
    <section class="sec focus" id="focus"></section>
    <section class="sec"><h2>Markets</h2><div id="q-index"></div></section>
    <section class="sec"><h2>Risk gauges</h2><div id="q-risk"></div></section>
    <section class="sec"><h2>Space + Musk peers</h2><div id="q-peer"></div></section>
  </div>

  <div class="col mid">
    <div class="feedhead">
      <div class="tabs" role="group" aria-label="Filter">
        <button class="tab" data-f="all">ALL<span class="n" id="n-all"></span></button>
        <button class="tab" data-f="alert">ALERTS<span class="n" id="n-alert"></span></button>
        <button class="tab" data-f="spacex">SPACEX<span class="n" id="n-spacex"></span></button>
        <button class="tab" data-f="market">MARKET<span class="n" id="n-market"></span></button>
      </div>
      <input class="search" id="q" type="search" placeholder="filter headlines  (e.g. starship, cpi)">
    </div>
    <ul class="items" id="items"><li class="empty">Loading data.json</li></ul>
  </div>

  <div class="col right">
    <section class="sec"><h2>Catalysts <small>ET</small></h2><ul class="cal" id="cal"></ul></section>
    <section class="sec"><h2>Alert thresholds</h2><div class="health" id="thr"></div></section>
    <section class="sec"><h2>Feed health</h2><div class="health" id="health"></div></section>
    <div class="foot">Headlines are scored by keyword impact, not by a human. Not investment advice.</div>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TZ = "America/New_York";
  let DATA = null, filter = "all", query = "";

  try { filter = localStorage.getItem("spcx.filter") || "all"; } catch (e) {}

  const fmt = (n, d = 2) => n == null ? "n/a" : Number(n).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
  const pct = p => (p >= 0 ? "+" : "") + fmt(p) + "%";
  const cls = p => p >= 0 ? "up" : "down";
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const timeET = iso => new Date(iso).toLocaleTimeString("en-US", {timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false});
  const dayET = iso => new Date(iso).toLocaleDateString("en-US", {timeZone: TZ, month: "short", day: "numeric"});
  const todayET = () => new Date().toLocaleDateString("en-CA", {timeZone: TZ});

  function ago(iso) {
    const s = (Date.now() - new Date(iso)) / 1000;
    if (s < 90) return "just now";
    if (s < 3600) return Math.round(s / 60) + "m ago";
    if (s < 86400) return Math.round(s / 3600) + "h ago";
    return Math.round(s / 86400) + "d ago";
  }

  function spark(points, up) {
    if (!points || points.length < 2) return "";
    const w = 268, h = 78, min = Math.min(...points), max = Math.max(...points), r = (max - min) || 1;
    const xy = points.map((p, i) => [(i / (points.length - 1)) * w, h - 4 - ((p - min) / r) * (h - 8)]);
    const d = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const col = up ? "var(--up)" : "var(--down)";
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up ? '#3ddc84' : '#ff4d5e'}" stop-opacity=".22"/><stop offset="1" stop-opacity="0" stop-color="#000"/></linearGradient></defs>
      <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#g)"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
  }

  function renderQuotes() {
    const q = DATA.quotes || {}, meta = DATA.quote_meta || [];
    $("tape").innerHTML = meta.map(m => {
      const v = q[m.symbol]; if (!v) return "";
      return `<div class="tk"><span class="lab">${esc(m.label)}</span><b>${fmt(v.price, v.price > 1000 ? 0 : 2)}</b><span class="${cls(v.pct)}">${pct(v.pct)}</span></div>`;
    }).join("");

    const s = q["SPCX"];
    if (s) {
      const pts = s.spark || [];
      const lo = pts.length ? Math.min(...pts) : null, hi = pts.length ? Math.max(...pts) : null;
      $("focus").innerHTML = `
        <h2>Focus <small>${s.stale ? "stale quote" : "Nasdaq"}</small></h2>
        <div class="sym">SPCX · SPACE EXPLORATION TECHNOLOGIES</div>
        <div class="px">${fmt(s.price)}</div>
        <div class="chg ${cls(s.pct)}">${s.change >= 0 ? "+" : ""}${fmt(s.change)} (${pct(s.pct)})</div>
        ${spark(pts, s.pct >= 0)}
        <div class="range"><span>prev ${fmt(s.prev_close)}</span>${lo != null ? `<span>L ${fmt(lo)} · H ${fmt(hi)}</span>` : ""}</div>`;
    } else {
      $("focus").innerHTML = `<h2>Focus</h2><div class="empty" style="padding:10px 0">SPCX quote unavailable</div>`;
    }

    for (const g of ["index", "risk", "peer"]) {
      $("q-" + g).innerHTML = meta.filter(m => m.group === g).map(m => {
        const v = q[m.symbol];
        if (!v) return `<div class="qrow"><span class="l">${esc(m.label)}</span><span class="p">n/a</span><span></span></div>`;
        return `<div class="qrow"><span class="l" title="${esc(m.symbol)}">${esc(m.label)}</span><span class="p">${fmt(v.price, v.price > 1000 ? 0 : 2)}</span><span class="c ${cls(v.pct)}">${pct(v.pct)}</span></div>`;
      }).join("");
    }
  }

  function tier(s) { return s >= 14 ? "s4" : s >= 9 ? "s3" : s >= 5 ? "s2" : ""; }

  function renderItems() {
    const items = DATA.items || [];
    const counts = {all: items.length, alert: items.filter(i => i.alert).length,
      spacex: items.filter(i => i.category === "spacex").length, market: items.filter(i => i.category === "market").length};
    for (const k in counts) $("n-" + k).textContent = counts[k];
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === filter));

    const qq = query.trim().toLowerCase();
    const list = items.filter(i =>
      (filter === "all" || (filter === "alert" ? i.alert : i.category === filter)) &&
      (!qq || (i.title + " " + i.source + " " + (i.hits || []).join(" ")).toLowerCase().includes(qq)));

    if (!list.length) { $("items").innerHTML = `<li class="empty">No headlines match.</li>`; return; }
    const today = todayET();
    $("items").innerHTML = list.slice(0, 250).map(i => {
      const isPrice = i.kind === "price";
      const d = new Date(i.published).toLocaleDateString("en-CA", {timeZone: TZ});
      const title = i.link ? `<a class="ttl" href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>` : `<span class="ttl">${esc(i.title)}</span>`;
      const chips = (i.hits || []).slice(0, 4).map(h => `<span class="chip">${esc(h)}</span>`).join("");
      return `<li class="it ${i.alert ? "hot" : ""}">
        <div class="t">${timeET(i.published)}${d !== today ? `<span class="d">${dayET(i.published)}</span>` : ""}</div>
        <div class="score ${tier(i.score)}" title="impact score">${fmt(i.score, i.score % 1 ? 1 : 0)}</div>
        <div>${title}
          <div class="meta"><span class="cat ${isPrice ? "price" : i.category}">${isPrice ? "PRICE" : esc(i.category).toUpperCase()}</span>
          <span>${esc(i.source)}</span>${chips}</div></div></li>`;
    }).join("");
  }

  function renderSide() {
    const now = new Date(), today = todayET();
    const cats = (DATA.catalysts || []).slice().sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
    const upcoming = cats.filter(c => c.date >= today), past = cats.filter(c => c.date < today).slice(-2);
    $("cal").innerHTML = [...past, ...upcoming].map(c => {
      const days = Math.round((new Date(c.date + "T12:00:00") - new Date(today + "T12:00:00")) / 86400000);
      const when = days === 0 ? "TODAY" : days < 0 ? "done" : days + "d";
      const dt = new Date(c.date + "T12:00:00").toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric"});
      return `<li class="${days < 0 ? "past" : ""}"><div class="cd">${days > 0 ? days : ""}<small>${days > 0 ? "days" : when}</small></div>
        <div><div class="lbl">${esc(c.label)}</div>
        <div class="sub">${dt}${c.time ? " · " + esc(c.time) : ""} <span class="tag ${c.type === "spacex" ? "spacex" : "macro"}">${c.type === "spacex" ? "SPCX" : "MACRO"}</span>
        ${c.confirmed === false ? `<span class="tag unc" title="${esc(c.note || "")}">UNCONFIRMED</span>` : ""}</div></div></li>`;
    }).join("") || `<li class="empty">No catalysts in config.json</li>`;

    const t = DATA.thresholds || {};
    $("thr").innerHTML = `<div><span>SpaceX headlines</span><span>score ≥ ${t.spacex ?? "?"}</span></div>
      <div><span>Market headlines</span><span>score ≥ ${t.market ?? "?"}</span></div>
      <div><span>Edit in</span><span>config.json</span></div>`;

    $("health").innerHTML = (DATA.feeds || []).map(f =>
      `<div><span><span class="dot" style="background:${f.ok ? "var(--up)" : "var(--down)"}"></span>${esc(f.name)}</span><span>${f.ok ? f.count : "fail"}</span></div>`).join("");
  }

  function renderHeader() {
    const stale = (Date.now() - new Date(DATA.generated_at)) > 3 * 3600 * 1000;
    const m = $("mkt");
    m.className = "pill " + (stale ? "stale" : DATA.market_open ? "open" : "closed");
    m.textContent = stale ? "BOT STALE" : DATA.market_open ? "MARKET OPEN" : "MARKET CLOSED";
    $("age").textContent = "updated " + ago(DATA.generated_at);
  }

  function render() { if (!DATA) return; renderHeader(); renderQuotes(); renderItems(); renderSide(); }

  // On GitHub Pages, read data.json straight from the repo so it is fresh even
  // when the Pages rebuild lags behind the bot's commits.
  function dataUrls() {
    const urls = [];
    const h = location.hostname;
    if (h.endsWith(".github.io")) {
      const owner = h.split(".")[0];
      const repo = location.pathname.split("/").filter(Boolean)[0] || (owner + ".github.io");
      urls.push(`https://raw.githubusercontent.com/${owner}/${repo}/main/docs/data.json`);
    }
    urls.push("data.json");
    return urls;
  }

  async function load() {
    try {
      let r = null;
      for (const u of dataUrls()) {
        try { r = await fetch(u + "?t=" + Date.now(), {cache: "no-store"}); if (r.ok) break; } catch (e) { r = null; }
      }
      if (!r || !r.ok) throw new Error("no data");
      DATA = await r.json();
      render();
    } catch (e) {
      if (!DATA) $("items").innerHTML = `<li class="empty">Could not load data.json yet. The bot writes it on its first run.</li>`;
      $("age").textContent = "load failed";
    }
  }

  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.f; try { localStorage.setItem("spcx.filter", filter); } catch (e) {}
    renderItems();
  }));
  $("q").addEventListener("input", e => { query = e.target.value; renderItems(); });
  $("refresh").addEventListener("click", load);

  function tick() {
    $("clock").textContent = new Date().toLocaleTimeString("en-US", {timeZone: TZ, hour12: false}) + " ET";
    if (DATA) $("age").textContent = "updated " + ago(DATA.generated_at);
  }
  setInterval(tick, 1000); tick();
  setInterval(load, 60000);
  load();
})();
</script>
</body>
</html>
