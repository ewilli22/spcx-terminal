name: SPCX monitor

on:
  schedule:
    # Every 10 minutes, all day. GitHub may delay scheduled runs a few minutes at busy times.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: spcx-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python bot/monitor.py

      - name: Save state and dashboard data
        run: |
          git config user.name "spcx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs/data.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase --autostash
            git push
          fi
